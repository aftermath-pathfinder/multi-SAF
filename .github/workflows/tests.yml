name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4]
        # Laravel 10 and 11 are past Laravel's 2-year security-support
        # window (EOL Feb 2025 and Mar 2026 respectively) - only test
        # against currently-supported releases.
        laravel: [12.*, 13.*]
        exclude:
          # Laravel 12 requires PHP ^8.2, dropping PHP 8.1.
          - php: 8.1
            laravel: 12.*
          # Laravel 13 requires PHP ^8.3, dropping PHP 8.1 and 8.2.
          - php: 8.1
            laravel: 13.*
          - php: 8.2
            laravel: 13.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
